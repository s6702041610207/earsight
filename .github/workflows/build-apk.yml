# Builds a debug APK on GitHub's servers (no Android Studio needed on your PC).
# Result: Actions tab → latest run → Artifacts → "earsight-apk" (zip containing app-debug.apk)
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project files
        run: |
          flutter --version
          flutter create . --platforms=android --org com.earsight --project-name earsight
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml || (echo "AndroidManifest lost permissions" && exit 1)
          # flutter create adds a counter-app widget test that does not apply to this app
          rm -f test/widget_test.dart
          # some plugins (tflite_flutter) compile Kotlin for a different JVM target than Java; don't fail on that mismatch
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          # tensorflow-lite 2.11 ships 3 AARs sharing the namespace org.tensorflow.lite; newer AGP rejects that by default
          echo "android.uniquePackageNames=false" >> android/gradle.properties

      - name: Set minSdk 26 (needed by tflite_flutter)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk( =|Version)? *=? *flutter\.minSdkVersion/minSdk = 26/' "$f"
            sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 26/' "$f"
            grep -n -i "minsdk\|ndkVersion\|compileSdk\|targetSdk" "$f" | sed "s|^|::notice::$f |" || true
          done

      - name: Download YAMNet model
        run: |
          set -e
          curl -fL --retry 3 -o assets/models/yamnet.tflite \
            "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/audio_classification/android/lite-model_yamnet_classification_tflite_1.tflite" \
          || curl -fL --retry 3 -o assets/models/yamnet.tflite \
            "https://tfhub.dev/google/lite-model/yamnet/classification/tflite/1?lite-format=tflite"
          ls -la assets/models
          test $(stat -c%s assets/models/yamnet.tflite) -gt 1000000

      - run: flutter pub get && flutter pub deps --style=compact | grep -E 'tflite|record|vibration' || true

      - name: Patch old plugins to compileSdk 36 (their AndroidX deps need 34+)
        run: |
          for f in ~/.pub-cache/hosted/pub.dev/*/android/build.gradle ~/.pub-cache/hosted/pub.dev/*/android/build.gradle.kts; do
            [ -f "$f" ] || continue
            if grep -q -E "compileSdk(Version)?( *=)? *(2[0-9]|3[0-3])\b" "$f"; then
              sed -i -E 's/compileSdk(Version)?( *=)? *(2[0-9]|3[0-3])\b/compileSdk\1\2 36/' "$f"
              echo "::notice::patched $f"
            fi
          done

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log || { tail -n 40 test.log | sed 's/^/::error::/'; exit 1; }

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log || {
            m=$(grep -B1 -A6 "Error:" build.log | head -n 60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=details::$m"
            m=$(grep -A8 "What went wrong" build.log | head -n 30 | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=what::$m"
            m=$(grep -v "^\s*$" build.log | tail -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g'); echo "::error title=tail::$m"
            exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: earsight-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EarSight v1 build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-debug.apk
          make_latest: true

      - name: Publish build log (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: build log ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            build.log
            test.log
