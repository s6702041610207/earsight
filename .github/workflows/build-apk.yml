# Builds a debug APK on GitHub's servers (no Android Studio needed on your PC).
# Result: Actions tab → latest run → Artifacts → "earsight-apk" (zip containing app-debug.apk)
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project files
        run: |
          flutter --version
          flutter create . --platforms=android --org com.earsight --project-name earsight
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml || (echo "AndroidManifest lost permissions" && exit 1)

      - name: Set minSdk 26 (needed by tflite_flutter)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk( =|Version)? *=? *flutter\.minSdkVersion/minSdk = 26/' "$f"
            sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 26/' "$f"
            echo "--- $f"; grep -n -i "minsdk\|ndkVersion" "$f" || true
          done

      - name: Download YAMNet model
        run: |
          set -e
          curl -fL --retry 3 -o assets/models/yamnet.tflite \
            "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/audio_classification/android/lite-model_yamnet_classification_tflite_1.tflite" \
          || curl -fL --retry 3 -o assets/models/yamnet.tflite \
            "https://tfhub.dev/google/lite-model/yamnet/classification/tflite/1?lite-format=tflite"
          ls -la assets/models
          test $(stat -c%s assets/models/yamnet.tflite) -gt 1000000

      - run: flutter pub get

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: earsight-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
